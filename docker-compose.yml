version: "3.9"

services:
  backend:
    build:
      context: ./backend
    volumes:
      - db_data:/app/data
      - scan_workspace:/workspace
      # To scan a local directory with semgrep, set SOURCE_DIR in your .env file:
      #   SOURCE_DIR=/path/to/your/code
      # The directory will be available inside the container at /workspace/source
      - ${SOURCE_DIR:-/tmp}:/workspace/source:ro
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - SOURCE_DIR=${SOURCE_DIR:-}
    expose:
      - "8000"
    networks:
      - dast_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    ports:
      - "1337:80"
    depends_on:
      - backend
    networks:
      - dast_net
    restart: unless-stopped

volumes:
  db_data:
  scan_workspace:

networks:
  dast_net:
    driver: bridge
